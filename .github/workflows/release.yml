name: Maven release from GitHub Actions

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version'
        required: true
      developmentVersion:
        description: 'Development version'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        run: |
          mvn -B -ntp release:prepare release:perform \
            -DreleaseVersion=${{ github.event.inputs.releaseVersion }} \
            -DdevelopmentVersion=${{ github.event.inputs.developmentVersion }} \
            -Darguments="-Dgithub.packages.url=https://maven.pkg.github.com/${{ github.repository }}" \
            -s .mvn/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Upload WAR to GitHub Release (gh CLI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # If your Maven release tag is "1.2.3" (no v), change this to:
          # TAG="${{ github.event.inputs.releaseVersion }}"
          TAG="v${{ github.event.inputs.releaseVersion }}"

          # Prefer WAR from common release plugin checkout/build paths
          WAR_PATH="$(find target/checkout/target target . -type f -name '*.war' 2>/dev/null | head -n 1)"
          if [ -z "${WAR_PATH}" ]; then
            echo "No WAR file found."
            exit 1
          fi

          # Create release if it doesn't exist yet
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --notes "Release $TAG"
          fi

          # Upload/overwrite WAR asset
          gh release upload "$TAG" "$WAR_PATH" \
            --repo "${{ github.repository }}" \
            --clobber